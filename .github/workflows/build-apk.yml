name: 构建 APK

# 两种触发方式：
#   1. 手动 —— 仓库页面 Actions → 构建 APK → Run workflow
#   2. 打标签 —— git tag v1.0.0 && git push origin v1.0.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用作 Release 标签，例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: apktool 打包
        run: |
          # apktool 偶尔返回非 0 退出码但产物其实已生成，所以用产物是否存在来判断成败
          java -jar tools/apktool.jar b . -o /tmp/unsigned.apk || true
          if [ ! -f /tmp/unsigned.apk ]; then
            echo "::error::apktool 打包失败，未生成 APK"
            exit 1
          fi
          ls -lh /tmp/unsigned.apk

      - name: 签名
        run: |
          # 不指定 keystore 时 uber-apk-signer 使用内置固定 debug key，
          # 与本地打包出来的签名一致，已安装的旧版可以直接覆盖升级
          java -jar tools/uber-apk-signer.jar --apks /tmp/unsigned.apk -o /tmp/signed

      - name: 整理产物（只保留一个可安装包）
        id: pack
        run: |
          NAME="BydLauncherMap-3.722-lane-building-${{ steps.ver.outputs.tag }}.apk"
          mkdir -p dist
          SIGNED=$(ls /tmp/signed/*-aligned-debugSigned.apk 2>/dev/null | head -1)
          if [ -z "$SIGNED" ]; then
            echo "::error::签名产物未找到"
            exit 1
          fi
          mv "$SIGNED" "dist/$NAME"
          rm -rf /tmp/signed /tmp/unsigned.apk
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: dist/${{ steps.pack.outputs.name }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          cat > /tmp/notes.md <<EOF
          高德车机版 3.5.722 定制包

          已包含的改动：
          - 车道级导航强开
          - 显示建筑物开关（设置 → 导航设置，状态持久化）
          - 更新地图渲染资源（修复车道级下建筑/草/图标不显示）

          安装：下载下方 APK 直接安装。使用 debug 签名，覆盖安装同签名旧版即可。

          SHA256: $SHA256
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file /tmp/notes.md
          fi

