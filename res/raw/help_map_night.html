<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <p>
            <font color="#EBF4FE">1. 如何显示路况信息？</font>
            <br>
            <small><font color="#86909B">默认显示路况，可以在【设置】——【地图】——【路况】中选择是否显示路况。</font></small>
        </p>
        <p>
            <font color="#EBF4FE">2. 导航中实时路况的颜色分别代表什么意思？</font>
            <br>
            <small><font color="#86909B">实时路况共有五种颜色，分别代表的含义是：绿色-畅通；黄色-缓慢；红色-拥堵；深红色-严重拥堵；蓝色-该路段无路况信息。</font></small>
        </p>
    </body>
</html>
