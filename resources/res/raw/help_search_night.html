<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <p>
            <font color="#EBF4FE">1. 如何搜索？</font>
            <br>
            <small><font color="#86909B">在图面上，点击搜索框，可直接输入目的地进行搜索。</font></small>
        </p>
        <p>
            <font color="#EBF4FE">2. 如何查周边？</font>
            <br>
            <small><font color="#86909B">可通过在搜索结果卡片或者移动图面在弹出卡片上点击【搜周边】，弹出页上显示周边的分类，同时也可以通过手动搜索来查找周边目的地。</font></small>
        </p>
        <p>
            <font color="#EBF4FE">3. 如何设置家/公司地址？</font>
            <br>
            <small><font color="#86909B">在主页面、搜索页面或者收藏夹中，点击设置家或公司的位置。</font></small>
        </p>
        <p>
            <font color="#EBF4FE">4. 如何添加收藏点？</font>
            <br>
            <small><font color="#86909B">可通过搜索信息点添加收藏点，也可移动图面在弹出的卡片信息点中添加收藏点，收藏的信息点可进行查周边和导航。</font></small>
        </p>
        <p>
            <font color="#EBF4FE">5. 如何修改家/公司或收藏点地址？</font>
            <br>
            <small><font color="#86909B">在图面上，点击个人中心，选择【收藏夹】，点击卡片右侧的“更多”进行修改操作。</font></small>
        </p>
    </body>
</html>
